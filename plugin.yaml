name: feishu-streaming-platform
label: Feishu / Lark (Streaming Cards)
kind: platform
version: "2.0.29"
# v2.0.18：声明 Python 依赖（PEP 508）——hermes v0.22.x PM 契约收紧（"conflicts
# are refused, updates disable a plugin that no longer fits"），声明后由 PM 随
# 核心环境统一解析（v2.0.13 部署事故——PM 环境漂移缺 yaml——的机制化收尾）。
# 版本 floor 与 pyproject.toml [project].dependencies 逐字同步（v1.8.0 P1-1
# 双硬 floor：1.4.0 无 async cardkit API；1.6.4 才有 extra_ua_tags）。
python_dependencies:
  - "lark-oapi>=1.6.4"
  - "PyYAML>=6.0"
description: >
  Feishu / Lark CardKit v2.0 streaming-card platform for Hermes Agent —
  a drop-in, zero-monkey-patch replacement for the built-in Feishu platform.
  Answers stream into live CardKit cards with a typing effect, tool progress
  and thinking bubbles render into the card status panel, clarification
  prompts become interactive cards, and out-of-turn deliveries (cron job
  responses, long-form proactive sends) arrive as static digest cards
  instead of raw text. Inherits the full built-in FeishuAdapter
  surface (WebSocket/webhook, media, threads, DM pairing, group gating,
  comments, meeting invites) and adds the card layer on top. Enable by
  switching the platform name from `feishu` to `feishu-streaming` in the
  gateway config; switch back anytime to restore native behavior.
author: Aowen-Nowor
requires_env:
  - name: FEISHU_APP_ID
    description: "Feishu/Lark app ID"
    prompt: "Feishu App ID"
    url: "https://open.feishu.cn/"
    password: false
  - name: FEISHU_APP_SECRET
    description: "Feishu/Lark app secret"
    prompt: "Feishu App Secret"
    url: "https://open.feishu.cn/"
    password: true
optional_env:
  - name: FEISHU_DOMAIN
    description: "Domain: 'feishu' (China) or 'lark' (International)"
    prompt: "Domain (feishu/lark)"
    password: false
  - name: FEISHU_ALLOWED_USERS
    description: "Comma-separated Feishu user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: FEISHU_ALLOW_ALL_USERS
    description: "Allow any Feishu user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: FEISHU_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
