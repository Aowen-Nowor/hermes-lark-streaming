name: Hermes Release Watch

# hermes-agent 上游发新版 → 自动兼容性验证 → 飞书推送最终结论。
# （2026-11-11 用户验收语义改版：推送必须是「更新内容 + 插件是否兼容」的
# 结果，而不是建议人工去做哪些测试。）
#
# 流程：检测新版本 → 拉取新版 hermes-agent 源码 + 本插件最新代码 →
# scripts/compat_probe.py 五步探测（S1 源码导入 / S2 插件绑定 / S3 继承面
# fail-fast / S4 官方表面清单 / S5 新版环境回归测试）→ 推送 ✅/❌ 结论卡
# （含 release notes 摘要与失配点明细）。无论结论如何都记录 last-seen——
# 已测过的版本不重复推送。
#
# 取代 V1 hermes-integration-test.yml：其运行的 tests/integration/ 兼容套件
# 已随 V2 架构删除，且该工作流钉死 Python 3.11（hermes 官方唯一受支持
# 运行时为 3.14，本工作流 setup-python 3.14 对齐）。
#
# 所需 Secrets：FEISHU_WEBHOOK / FEISHU_SIGN_SECRET / GH_MIRROR_PAT（读
# 私有镜像仓与插件 refactor 分支 full history 的 checkout）。

on:
  schedule:
    - cron: '33 0 * * *'  # 08:33 AM Asia/Shanghai, 避开整点高负载
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      last: ${{ steps.check.outputs.last }}
      has_new: ${{ steps.check.outputs.has_new }}
    steps:
      - name: Checkout (scripts/)
        uses: actions/checkout@v4

      - name: Restore last seen release
        # .hermes-last-release 在 .gitignore 中，经 Actions Cache 持久化（V1 同款模式）
        uses: actions/cache/restore@v4
        with:
          path: .hermes-last-release
          key: hermes-last-release-${{ github.run_number }}
          restore-keys: |
            hermes-last-release-

      - name: Check latest hermes release
        id: check
        run: |
          LATEST=$(curl -sf https://api.github.com/repos/NousResearch/hermes-agent/releases/latest | jq -r '.tag_name // empty')
          if [ -z "$LATEST" ]; then
            echo "❌ 无法获取 NousResearch/hermes-agent 最新 release"
            exit 1
          fi
          LAST=$(cat .hermes-last-release 2>/dev/null || echo "none")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "last=$LAST" >> $GITHUB_OUTPUT
          if [ "$LATEST" != "$LAST" ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "🆕 新版本检测: $LATEST (上次: $LAST)"
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "无新版本 ($LATEST)"
          fi

  compat:
    needs: watch
    if: needs.watch.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    env:
      HERMES_LATEST: ${{ needs.watch.outputs.latest }}
      HERMES_LAST: ${{ needs.watch.outputs.last }}
    steps:
      - name: Checkout plugin (github_sync tip)
        # 生产主分支 github_sync 含完整插件与测试套件（分支模型定案 2026-11-11：
        # GitHub 只保留 github_sync，refactor/v2.0.0 是 Gitee 独有开发分支已删除）；
        # 兼容性验证测的就是生产代码；PAT 才能拉 full history
        uses: actions/checkout@v4
        with:
          ref: github_sync
          token: ${{ secrets.GH_MIRROR_PAT }}
          fetch-depth: 0

      - name: Restore last seen release
        uses: actions/cache/restore@v4
        with:
          path: .hermes-last-release
          key: hermes-last-release-${{ github.run_number }}
          restore-keys: |
            hermes-last-release-

      - name: Checkout hermes-agent ${{ env.HERMES_LATEST }}
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_LATEST }}
          path: hermes-agent
          fetch-depth: 1

      - name: Setup Python 3.14 (hermes 官方唯一受支持运行时)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install plugin + hermes deps
        run: |
          python -m pip install --upgrade pip
          pip install 'lark-oapi>=1.6.4' PyYAML pytest
          # hermes 官方依赖全集（S1 导入链需要；-e 源码模式对齐"新版源码"语义）
          pip install -e ./hermes-agent

      - name: Run compat probe (S1-S5)
        id: probe
        run: |
          set -o pipefail
          python3 scripts/compat_probe.py --hermes-dir ./hermes-agent --json compat_report.json | tee compat_probe.log
          echo "verdict=$(python3 -c "import json;print(json.load(open('compat_report.json'))['verdict'])")" >> $GITHUB_OUTPUT
          # 明细摘要：各步一行（PASS/FAIL + 截断 detail），飞书卡承载
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          r = json.load(open('compat_report.json'))
          lines = []
          for s in r["steps"]:
              mark = "✅" if s["ok"] else "❌"
              first = s["detail"].strip().splitlines()[0][:120] if s["detail"].strip() else ""
              lines.append(f"{mark} {s['step']}：{first}")
          tail = "\n".join(r.get("tests_stdout_tail", "").splitlines()[-3:])
          if tail:
              lines.append(tail)
          print(f"summary<<EOF\n{chr(10).join(lines)}\nEOF")
          PY

      - name: Fetch release notes
        if: always()
        run: |
          BODY=$(curl -sf "https://api.github.com/repos/NousResearch/hermes-agent/releases/tags/${HERMES_LATEST}" | jq -r '.body // empty' | head -c 600)
          # 控制字符/超长换行拍平成飞书可读摘要
          NOTES=$(printf '%s' "$BODY" | tr '\r' ' ' | awk 'BEGIN{RS=""; ORS="\n"} {print}' | head -c 600)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "${NOTES:-（release notes 为空）}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        id: notes

      - name: Notify Feishu (兼容性结论)
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
          COMPAT_VERDICT: ${{ steps.probe.outputs.verdict }}
          HERMES_NOTES: ${{ steps.notes.outputs.notes }}
        run: python3 scripts/feishu_notify.py hermes-release

      - name: Save seen release (无论兼容结论——已测过的版本不重复推送)
        if: always()
        run: echo "${{ env.HERMES_LATEST }}" > .hermes-last-release

      - name: Persist to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .hermes-last-release
          key: hermes-last-release-${{ github.run_number }}
