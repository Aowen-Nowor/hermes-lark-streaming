name: Sync from Gitee

# Gitee → GitHub 镜像 + 质量门禁 + 飞书通知（v2.0.27 重写）。
#
# v2.0.27 变更：
#   - 镜像策略：remote-to-remote 强制对齐（Gitee 唯一事实源，零 merge commit）；
#     只镜像 github_sync（主分支）+ 全部 tag。（V1 版同样只同步 github_sync——那是 V1 默认分支。）
#
# v2.0.34 后分支模型定案（用户裁决 2026-11-11）：
#   - Gitee refactor/v2.0.0 = 开发分支，只存在于 Gitee（GitHub 不需要、不再镜像、已删除）
#   - Gitee github_sync = 主分支：开发完成后由维护者手动同步（fast-forward 推送）
#   - 本工作流只镜像 github_sync + tags 到 GitHub；变更检测/测试/Release 全部以
#     github_sync 位移为基准（原 refactor 位移基准随分支删除一并退役）
#   - 飞书 ci-report 发送条件收窄为「有新代码同步 或 本 run 有步骤失败」：
#     重验型 dispatch（force_tests 且无变更）不再推重复报告（#1560/#1561 两条雷同推送的根因）；
#     fetch/测试失败时 failure() 必然发失败报告——顺带修掉 fetch 失败静默无通知的缺陷
#   - 测试：全量 pytest（Python 3.14 对齐 hermes 官方），含 mock e2e；真飞书 E2E 不在 CI 跑
#     （限流/凭据面，验收走服务器 scripts/e2e_v2.py）。
#   - Release：测试通过后按 plugin.yaml 版本自动创建 GitHub Release（幂等）。
#   - 新增：Gitee PR/Issue 增量摘要 → 飞书（水位经 actions/cache 持久化，无更新静默）。
#
# v2.0.29 修复（GitHub 未同步事故）：
#   - 根因：GITHUB_TOKEN 永远无法获得 workflow 文件写权限（GitHub 安全设计：permissions 块不支持
#     workflows key，防 workflow 自改提权），V2 首次同步携带 .github/workflows/* 变更时
#     push 被 remote rejected。中途误加 `workflows: write` 会导致整个 workflow 解析失败（空 run failure）。
#   - 修复：checkout/push 改用 secrets.GH_MIRROR_PAT（classic PAT，需 repo + workflow scope）。
#   - 连带修复：Release 幂等判定改查 GitHub Release 是否已存在（原逻辑查 tag，但 tag 先于判定
#     由 Mirror 步骤从 Gitee 镜像，永远存在 → Release 永不创建）。
#
# v2.0.32 修复（CI 审计 2026-11-09，run #1506 日志实证）：
#   - fetch 零重试：gitee ↔ GitHub Actions 跨网间歇性超时（Connection timed out after
#     300040ms，run #1506 2026-10-30），单次尝试挂满 300s 后整轮作废，镜像/测试/Release 全 skipped。
#     修复：http.lowSpeedLimit/Time 低速判死（60s 内 <1KB/s 即断，不再挂满 300s）+ 3 次重试递增等待。
#   - 测试门禁失效：默认 shell 是 bash -e（无 pipefail），`pytest | tee` 后 `$?` 取的是 tee 的
#     退出码——pytest 全红 exit_code 仍为 0，红测试照样放行 GitHub Release。
#     修复：该步骤显式 shell: bash（-eo pipefail），pytest 退出码穿透管道，失败即整步失败。
#   - 测试/发布树错位：run 的工作树停留在 dispatch 时的旧 checkout（run #1546 实证：检出 b0c38d0，
#     Mirror 已把 a51cc0a 推上 GitHub，但 pytest 与 plugin.yaml 仍读旧树——版本号命中既有 Release 被跳过，
#     且变更事件被本轮消费后下轮 has_changes=false，新版本 Release 永远缺位＝v2.0.30/31 未发布的结构性根因）。
#     修复：Detect changes 后重新检出刚镜像的 Gitee tip 再测试（现为 origin/github_sync）；
#     Release 以 target_commitish=new_sha 钉住被测提交。
#
# 所需 Secrets：GITEE_USERNAME / GITEE_TOKEN（同步+API）、FEISHU_WEBHOOK / FEISHU_SIGN_SECRET（通知）、
#               GH_MIRROR_PAT（GitHub 侧 checkout+push，classic PAT 含 repo + workflow scope）。

on:
  schedule:
    - cron: '44 * * * *'
  workflow_dispatch:
    inputs:
      force_tests:
        description: '强制运行测试（即使无变更）'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_MIRROR_PAT }}   # PAT 推送（含 workflow 文件变更）；GITHUB_TOKEN 永远无此权限

      - name: Configure Git
        run: |
          git config user.name "gitee-sync"
          git config user.email "sync@example.com"

      - name: Add Gitee remote and fetch
        run: |
          git remote add gitee "https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USERNAME }}/${{ github.event.repository.name }}.git"
          # 低速判死：60s 内 <1KB/s 即断连重试（默认要挂满 300s 才超时，run #1506 实证）
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          # --force：两平台同名 tag 对象不同源（V1 遗留），Gitee 为唯一事实源，同名 tag 强制以 Gitee 为准
          # 3 次重试递增等待（30s/60s）：gitee ↔ GitHub Actions 跨网间歇性超时是已证实故障源
          for attempt in 1 2 3; do
            echo "==> gitee fetch 第 ${attempt}/3 次"
            if git fetch gitee --prune --tags --force; then
              echo "fetch 成功（第 ${attempt} 次尝试）"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "❌ gitee fetch 连续 3 次失败，放弃本轮（下个调度周期或手动 dispatch 重试）"
          exit 1

      - name: Record pre-sync SHA
        id: pre_sync
        run: |
          if git rev-parse -q --verify "refs/remotes/origin/github_sync" >/dev/null; then
            echo "sha=$(git rev-parse origin/github_sync)" >> $GITHUB_OUTPUT
          else
            echo "sha=none" >> $GITHUB_OUTPUT
          fi

      - name: Mirror branches and tags (Gitee is source of truth)
        run: |
          # remote-to-remote 直推：不经工作树、不产生 merge commit，GitHub github_sync 强制对齐 Gitee
          # （分支模型定案 2026-11-11：refactor/v2.0.0 是 Gitee 独有开发分支，不再镜像 GitHub）
          git push --force origin "refs/remotes/gitee/github_sync:refs/heads/github_sync"
          git push --force origin "refs/tags/*:refs/tags/*"

      - name: Detect changes
        id: detect
        run: |
          OLD="${{ steps.pre_sync.outputs.sha }}"
          NEW=$(git rev-parse gitee/github_sync)
          echo "new_sha=$NEW" >> $GITHUB_OUTPUT
          if [ "$OLD" != "$NEW" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            if [ "$OLD" = "none" ]; then
              git log --pretty=format:"%s" -10 > commit_log.txt
              echo "（首次同步）" > changed_files.txt
            else
              git diff --name-only "$OLD" "$NEW" > changed_files.txt
              git log "$OLD".."$NEW" --pretty=format:"%s" --max-count=10 > commit_log.txt
            fi
            echo "🆕 检测到变更: $OLD..$NEW"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "" > commit_log.txt
            echo "" > changed_files.txt
            echo "无变更"
          fi

      # v2.0.32 修复③：Mirror 后工作树仍是 dispatch 时的旧 checkout——pytest 与 plugin.yaml
      # 版本读取必须发生在刚镜像的 Gitee tip 上（测试的代码=发布的代码）
      - name: Checkout mirrored tip for test & release
        if: steps.detect.outputs.has_changes == 'true' || inputs.force_tests == true
        uses: actions/checkout@v4
        with:
          ref: github_sync            # Mirror 步骤刚推送到 origin 的 Gitee 主分支 tip
          fetch-depth: 0
          token: ${{ secrets.GH_MIRROR_PAT }}

      - name: Set up Python
        if: steps.detect.outputs.has_changes == 'true' || inputs.force_tests == true
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        if: steps.detect.outputs.has_changes == 'true' || inputs.force_tests == true
        run: |
          python -m pip install --upgrade pip
          # PEP 735 dependency-group (pyproject [dependency-groups] dev) — the
          # plugin is metadata-only (no [build-system], fixes the upstream
          # multi-profile duplicate workspace-member name), so there is no
          # editable install to do: pip install -e . would fall back to legacy
          # setuptools auto-discovery and refuse the flat layout.
          pip install --group dev

      - name: Run full test suite (unit + e2e mock)
        if: steps.detect.outputs.has_changes == 'true' || inputs.force_tests == true
        id: run_tests
        # 显式 shell: bash = -eo pipefail：pytest 退出码穿透 tee 管道（默认 bash -e 无 pipefail，
        # $? 永远是 tee 的 0 → 红测试也判 0 并放行 Release）；pytest 失败时脚本在管道行中止，
        # exit_code 不落盘 → 下游 Release 条件不满足 + 通知侧 fallback 为 1
        shell: bash
        run: |
          python -m pytest tests/ --tb=short -q \
            --junitxml=unit_test_report.xml 2>&1 | tee unit_test_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      # ── GitHub Release（测试通过 + 版本 tag 未存在时创建，幂等）──
      - name: Read version from plugin.yaml
        if: steps.detect.outputs.has_changes == 'true' && steps.run_tests.outputs.exit_code == '0'
        id: version
        run: |
          VERSION=$(grep '^version:' plugin.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Detected version: $VERSION (tag: v$VERSION)"

      - name: Check if GitHub Release already exists
        if: steps.detect.outputs.has_changes == 'true' && steps.run_tests.outputs.exit_code == '0'
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          # 幂等锚 = Release 本身（tag 已由 Mirror 步骤先从 Gitee 镜像，查 tag 会永远误判已存在）
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "📌 Release $TAG already exists on GitHub, skipping"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "🆕 Release $TAG does not exist on GitHub, will create"
          fi

      - name: Prepare release notes
        if: steps.detect.outputs.has_changes == 'true' && steps.run_tests.outputs.exit_code == '0' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          echo "完整更新日志：https://raw.githubusercontent.com/${{ github.repository }}/github_sync/docs/CHANGELOG.md" > release_notes.md

      - name: Create GitHub Release
        if: steps.detect.outputs.has_changes == 'true' && steps.run_tests.outputs.exit_code == '0' && steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.detect.outputs.new_sha }}   # tag 钉在被测提交（默认 GITHUB_SHA=dispatch 旧 sha，错位）
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Gitee PR/Issue 增量摘要 → 飞书（水位经 cache 持久化）──
      - name: Restore Gitee digest state
        uses: actions/cache/restore@v4
        with:
          path: .gitee-digest-state.json
          key: gitee-digest-state-${{ github.run_number }}
          restore-keys: |
            gitee-digest-state-

      - name: Gitee PR/Issue digest → Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
          GITEE_OWNER: ${{ secrets.GITEE_USERNAME }}
          GITEE_REPO: ${{ github.event.repository.name }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 scripts/feishu_notify.py gitee-digest --state-file .gitee-digest-state.json

      - name: Persist Gitee digest state
        uses: actions/cache/save@v4
        with:
          path: .gitee-digest-state.json
          key: gitee-digest-state-${{ github.run_number }}

      # ── 同步+测试结果报告 → 飞书 ──
      # 通知条件（2026-11-11 定案）：有新代码同步 或 本 run 有步骤失败，才发报告。
      # force_tests 无变更的重验不再推报告（#1560/#1561 雷同推送根因）；
      # fetch 失败/测试失败走 failure() 必然显红——原条件在 fetch 失败时静默无通知。
      - name: Notify Feishu (sync report)
        if: always() && (failure() || steps.detect.outputs.has_changes == 'true')
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
          TEST_EXIT_CODE: ${{ steps.run_tests.outputs.exit_code || '1' }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          TRIGGER: ${{ github.event_name }}
        run: python3 scripts/feishu_notify.py ci-report
