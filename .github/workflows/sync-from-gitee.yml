name: Sync from Gitee

# Gitee → GitHub 镜像 + 质量门禁 + 飞书通知（v2.0.27 重写）。
#
# v2.0.27 变更：
#   - 镜像策略：remote-to-remote 强制对齐（Gitee 唯一事实源，零 merge commit）；
#     同时镜像 refactor/v2.0.0（V2 开发分支）与 github_sync（V1 冻结分支）+ 全部 tag。
#     （V1 版只同步 github_sync——那是 V1 默认分支，V2 发布后 GitHub 永远停在 1.8.x。）
#   - 测试：全量 pytest（Python 3.14 对齐 hermes 官方），含 mock e2e；真飞书 E2E 不在 CI 跑
#     （限流/凭据面，验收走服务器 scripts/e2e_v2.py）。
#   - Release：测试通过后按 plugin.yaml 版本自动创建 GitHub Release（幂等）。
#   - 新增：Gitee PR/Issue 增量摘要 → 飞书（水位经 actions/cache 持久化，无更新静默）。
#
# 所需 Secrets：GITEE_USERNAME / GITEE_TOKEN（同步+API）、FEISHU_WEBHOOK / FEISHU_SIGN_SECRET（通知）。

on:
  schedule:
    - cron: '44 * * * *'
  workflow_dispatch:
    inputs:
      force_tests:
        description: '强制运行测试（即使无变更）'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "gitee-sync"
          git config user.email "sync@example.com"

      - name: Add Gitee remote and fetch
        run: |
          git remote add gitee "https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USERNAME }}/${{ github.event.repository.name }}.git"
          git fetch gitee --prune --tags

      - name: Record pre-sync SHA
        id: pre_sync
        run: |
          if git rev-parse -q --verify "refs/remotes/origin/refactor/v2.0.0" >/dev/null; then
            echo "sha=$(git rev-parse origin/refactor/v2.0.0)" >> $GITHUB_OUTPUT
          else
            echo "sha=none" >> $GITHUB_OUTPUT
          fi

      - name: Mirror branches and tags (Gitee is source of truth)
        run: |
          # remote-to-remote 直推：不经工作树、不产生 merge commit，GitHub 各 ref 强制对齐 Gitee
          git push --force origin "refs/remotes/gitee/refactor/v2.0.0:refs/heads/refactor/v2.0.0"
          git push --force origin "refs/remotes/gitee/github_sync:refs/heads/github_sync"
          git push --force origin "refs/tags/*:refs/tags/*"

      - name: Detect changes
        id: detect
        run: |
          OLD="${{ steps.pre_sync.outputs.sha }}"
          NEW=$(git rev-parse gitee/refactor/v2.0.0)
          if [ "$OLD" != "$NEW" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            if [ "$OLD" = "none" ]; then
              git log --pretty=format:"%s" -10 > commit_log.txt
              echo "（首次同步）" > changed_files.txt
            else
              git diff --name-only "$OLD" "$NEW" > changed_files.txt
              git log "$OLD".."$NEW" --pretty=format:"%s" --max-count=10 > commit_log.txt
            fi
            echo "🆕 检测到变更: $OLD..$NEW"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "" > commit_log.txt
            echo "" > changed_files.txt
            echo "无变更"
          fi

      - name: Set up Python
        if: steps.detect.outputs.has_changes == 'true' || inputs.force_tests == true
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        if: steps.detect.outputs.has_changes == 'true' || inputs.force_tests == true
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full test suite (unit + e2e mock)
        if: steps.detect.outputs.has_changes == 'true' || inputs.force_tests == true
        id: run_tests
        run: |
          python -m pytest tests/ --tb=short -q \
            --junitxml=unit_test_report.xml 2>&1 | tee unit_test_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      # ── GitHub Release（测试通过 + 版本 tag 未存在时创建，幂等）──
      - name: Read version from plugin.yaml
        if: steps.detect.outputs.has_changes == 'true' && steps.run_tests.outputs.exit_code == '0'
        id: version
        run: |
          VERSION=$(grep '^version:' plugin.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Detected version: $VERSION (tag: v$VERSION)"

      - name: Check if tag already exists
        if: steps.detect.outputs.has_changes == 'true' && steps.run_tests.outputs.exit_code == '0'
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          # 用 ls-remote 查 GitHub 远程（fetch gitee 已把 Gitee tag 拉到本地，本地误判存在）
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "📌 Tag $TAG already exists on GitHub, skipping Release creation"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "🆕 Tag $TAG does not exist on GitHub, will create Release"
          fi

      - name: Prepare release notes
        if: steps.detect.outputs.has_changes == 'true' && steps.run_tests.outputs.exit_code == '0' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          echo "完整更新日志：https://raw.githubusercontent.com/${{ github.repository }}/refactor/v2.0.0/docs/CHANGELOG.md" > release_notes.md

      - name: Create GitHub Release
        if: steps.detect.outputs.has_changes == 'true' && steps.run_tests.outputs.exit_code == '0' && steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Gitee PR/Issue 增量摘要 → 飞书（水位经 cache 持久化）──
      - name: Restore Gitee digest state
        uses: actions/cache/restore@v4
        with:
          path: .gitee-digest-state.json
          key: gitee-digest-state-${{ github.run_number }}
          restore-keys: |
            gitee-digest-state-

      - name: Gitee PR/Issue digest → Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
          GITEE_OWNER: ${{ secrets.GITEE_USERNAME }}
          GITEE_REPO: ${{ github.event.repository.name }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 scripts/feishu_notify.py gitee-digest --state-file .gitee-digest-state.json

      - name: Persist Gitee digest state
        uses: actions/cache/save@v4
        with:
          path: .gitee-digest-state.json
          key: gitee-digest-state-${{ github.run_number }}

      # ── 同步+测试结果报告 → 飞书 ──
      - name: Notify Feishu (sync report)
        if: always() && (steps.detect.outputs.has_changes == 'true' || inputs.force_tests == true)
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
          TEST_EXIT_CODE: ${{ steps.run_tests.outputs.exit_code || '1' }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          TRIGGER: ${{ github.event_name }}
        run: python3 scripts/feishu_notify.py ci-report
