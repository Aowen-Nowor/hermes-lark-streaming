# Metadata-only plugin: deliberately NO [build-system] (v2.0.34 post-release
# fix; version untouched). hermes pm collects one uv workspace member per
# plugin *path* and only renames virtual members (no [build-system] and no
# tool.uv.package = true) to a unique `hermes-plugin-<path-hash>` key; a
# buildable member keeps its declared [project].name, so this plugin enabled
# in two profiles aborted every `hermes pm install` with "Two workspace
# members are both named `hermes-lark-streaming`" — the whole dependency
# generation failed and every plugin's python dependencies silently never
# landed (e.g. the memory provider's mem0ai). Nothing in the ecosystem builds
# or installs this plugin as a wheel: the hermes plugin loader imports
# __init__.py straight from the plugin directory, and the python dependencies
# below still resolve through the virtual member. Dropping the backend lets
# any number of profile copies coexist.
[project]
name = "hermes-lark-streaming"
# uv rejects any [project] table whose version is neither set nor dynamic
# (hermes pm would inject 0.0.0 into its workspace copy otherwise). Keep it
# dynamic: the single source of truth remains plugin.yaml (__init__.py parses
# it into __version__); with no build backend nothing resolves the dynamic
# value, which virtual members accept.
dynamic = ["version"]
description = "Feishu/Lark CardKit v2.0 streaming cards for Hermes Agent — plugin edition"
readme = "README.md"
license = {text = "MIT"}
# v2.0.12：与 hermes 官方完全对齐（hermes-agent pyproject.toml:10-15）：
#   requires-python = ">=3.11,<3.15"，注释原文 "we *only* support 3.14" ——
#   3.14 是唯一受支持运行时（wheels 仅保证 3.14），保留 3.11+ 元数据范围是
#   为了让旧 Python 上的既有安装能走完升级步骤（tests/compat 更新器契约）。
requires-python = ">=3.11,<3.15"
authors = [
    {name = "Aowen-Nowor"},
]
dependencies = [
    # v1.8.0 (P1-1): floor raised 1.4.24 → 1.6.4. Two independent hard floors:
    # ① 1.4.0 has NO async cardkit API at all (acreate/aupdate/abatch_update/
    #    asettings missing) — 1.4.24+ ships the full async set incl.
    #    card_element.acontent (v1.7.0 finding, wheel-by-wheel verified).
    # ② hermes-agent >= 0.19 passes ``extra_ua_tags`` to lark.Client — the
    #    kwarg exists only since lark-oapi 1.6.4 (4-version wheel diff; 1.5.1
    #    lacks it). Mixed installs (new hermes + old SDK) broke the feishu WS
    #    connect for 22 minutes in production on 2026-07-21. hermes itself
    #    pins lark-oapi==1.6.8 (feishu extra); this floor + the startup check
    #    (plugin/__init__.py _check_lark_oapi_floor) cover hand-managed envs.
    "lark-oapi>=1.6.4,<2.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

# The plugin code lives at the repo root (alongside plugin.yaml):
# root holds only __init__.py / __main__.py; runtime subpackages are direct
# children (plugin/ = hermes integration layer, cardkit|composer|feishu|config
# = card platform engine). The hermes plugin loader imports __init__.py
# directly from this directory — the [project] table above is dependency
# metadata only; no wheel is ever built from it.

[tool.pytest.ini_options]
testpaths = ["tests"]
# NOTE: no pythonpath needed — conftest.py registers the repo root
# as the hermes_lark_streaming package via importlib.
asyncio_mode = "auto"
# Integration tests require HERMES_SRC_DIR (set by hermes-integration-test.yml).
# Exclude from default `pytest tests/` run to avoid 25 skipped in sync-from-gitee.
# Run explicitly: `pytest tests/integration/`
norecursedirs = ["tests/integration"]
filterwarnings = [
    # lark_oapi uses deprecated datetime.utcfromtimestamp (Python 3.12+)
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
    # lark_oapi ws client calls asyncio.get_event_loop() at import time
    "ignore:There is no current event loop:DeprecationWarning",
    # v1.1.1: lark_oapi uses deprecated pkg_resources.declare_namespace
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:Deprecated call to:DeprecationWarning",
]
